# Vérifie chaque push ; sur master, publie la version (npm + release GitLab) puis la recopie sur GitHub.

workflow:
  rules:
    # Les tags sont posés par la release elle-même : rien à relancer dessus.
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [check, release]

default:
  image: node:22.23.5-bookworm
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

check:
  stage: check
  script:
    - npm run typecheck
    - npm run build

release:
  stage: release
  # Une seule release à la fois, même si deux pushes se suivent de près.
  resource_group: release
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm run build
    - npx semantic-release
    # Vide quand aucun feat/fix ne justifie de version : la recopie GitHub ne fait alors rien.
    - echo "RELEASE_TAG=$(git tag --points-at HEAD --list 'v*' | head -n1)" > release.env
  artifacts:
    reports:
      dotenv: release.env

include:
  - component: $CI_SERVER_FQDN/ci/ci-templates/github-release@main
    inputs:
      stage: release
      release_job: release
